[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "voice-evaluation-engine"
version = "0.1.0"
description = "Reproducible benchmarking for speech-to-text providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jiwer>=3.0,<5",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
huggingface = ["datasets[audio]>=3.0,<5"]
dev = ["mypy>=1.13,<2", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
